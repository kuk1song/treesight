<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-xvCmOOkgr7lhig/+NxFxmWmgrK7vhPJSdPocfSWx+DI='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>treesight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23131417'/%3E%3Cg transform='translate%284.4 3.6%29 scale%28.78%29'%3E%3Cpath d='M20 37V16.5' stroke='%23E9E8E3' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M20 29C14 29 10.5 26 8 21M20 21C26 21 29.5 18 32 13' fill='none' stroke='%23E9E8E3' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='21' r='4.6' fill='%23C8FF00'/%3E%3Ccircle cx='32' cy='13' r='4.6' fill='%23C8FF00'/%3E%3Ccircle cx='20' cy='7.5' r='4.8' fill='none' stroke='%23C8FF00' stroke-width='3.2'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* treesight page. Dark only for now. Every view grows from the bottom of what is visible when it appears
   (1 s the first time this data is seen, 0.6 s after; a click or key skips; nothing moves under reduced motion). */
/* colours: dev/palettes.json, scheme "default", dark; tests/test_page.py keeps the two in step */
:root{--bg:#0D0E11;--panel:#131417;--fill:#1D1E23;--line:#2B2C31;--line2:#33343A;--ink:#E9E8E3;--mut:#8F9095;--faint:#808186;
  --trunk:#3A3B41;--done:#C8FF00;--found:#FFD60A;--overturn:#9A9BA0;--waiting:#C8FF00;--hold:#6E6F74;--waiting-fill:none;--waiting-ring:#C8FF00;
  --scar-h:#9C8167;--scar-m:#C48A5C;--scar-d:#F0A060;--late:#FF6F61;--sess:#7E7F84;color-scheme:dark;
  --f:-apple-system,"PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit}
:where(button,a,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px}
.back{all:unset;cursor:pointer;position:fixed;left:0;top:96px;z-index:5;writing-mode:vertical-rl;letter-spacing:.3em;font-size:12.5px;color:var(--mut);background:var(--panel);border-radius:0 10px 10px 0;padding:14px 7px;transition:padding .15s ease-out,color .15s}
.back:hover,.back:focus-visible{color:var(--ink);padding-left:10px}.back[hidden]{display:none}
html:not([lang^="zh"]) .back{letter-spacing:.08em}
/* narrower than the side tab needs: a button above the legend, with an arrow so it reads as the way back, not as a legend item */
@media (max-width:1020px){.back{position:static;writing-mode:horizontal-tb;letter-spacing:0!important;border-radius:8px;padding:5px 11px;font-size:13.5px}.back:hover,.back:focus-visible{padding-left:11px}
  .back::before{content:'‹';margin-right:7px}.back:not([hidden])+.legend{flex-basis:100%}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .scr{width:10px;height:10px;border-radius:50%;border:2.2px solid var(--scar-m);display:inline-block}
main{max-width:940px;margin:0 auto;padding:0 20px 60px}
.where{text-align:center;margin:6px 0 0;display:grid;justify-items:center;gap:4px}
.where b{font-size:15px;font-weight:600;overflow-wrap:anywhere}.where small{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.where .since{font-family:var(--f);font-size:12px;color:var(--mut)}
.oit:focus-visible,.pz:focus-visible,.act:focus-visible,.cpy:focus-visible,.qm:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* an expanded node or session: one panel beside the trunk, its text flush left on both sides (a ragged left edge is hard to read) */
.xp{display:grid;gap:6px;max-width:420px;text-align:left;background:var(--panel);border-radius:12px;padding:10px 13px;font-size:13.5px}.row.l .xp{margin-left:auto}
.ai{font-size:10.5px;line-height:1.3;border:1px solid var(--line2);border-radius:4px;padding:0 4px;cursor:help}
.sum .ai,.card .ai{margin-right:6px;vertical-align:1px}.sum.none{color:var(--mut);font-size:12.5px}
/* shown only after one of the links was clicked: where it opened nothing, the same command to copy */
.after{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--mut)}.after:empty{margin-top:0}
.cpy{all:unset;cursor:pointer;font-size:12px;color:var(--ink);background:var(--fill);border-radius:6px;padding:1px 9px}.cpy:hover{background:var(--line2)}
.after code{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;user-select:all;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;margin-top:4px}
.act{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:3px 12px}.act:hover{border-color:var(--mut)}
.act.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}.act.pri:hover{opacity:.9}
svg.sh{flex:none;display:block;overflow:visible}
.tree{position:relative;padding:8px 0 30px}
.trunk{position:absolute;left:50%;top:150px;bottom:46px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--trunk)}
.crown{position:relative;display:grid;justify-items:center;align-content:start;padding:10px 0 14px;z-index:2}
.todo{all:unset;cursor:pointer;font-size:12.5px;color:var(--ink);background:var(--panel);padding:4px 12px;border-radius:999px;margin-top:6px;position:relative;z-index:1}
.todo:hover{background:var(--fill)}
.crown .cover,.crown .none{font-size:12px;color:var(--mut);background:var(--bg);padding:0 8px;margin-top:6px;position:relative;z-index:1}
.crown .none{font-size:12.5px}
.lgd{display:inline-flex;gap:16px}.lgd span{display:inline-flex;align-items:center;gap:5px}
.rows{position:relative;display:grid;gap:20px;margin-top:8px}
.row{display:grid;grid-template-columns:1fr 64px 1fr;align-items:start}
.arm{grid-column:2;height:26px;position:relative;top:calc(var(--tc) - 9px)}
.arm svg{position:absolute;top:0;width:calc(50% + 7px);height:26px}.arm path{stroke:var(--trunk)}
.row.l .arm svg{right:50%}.row.r .arm svg{left:50%}
.row .slot{grid-row:1;min-width:0}
.row.l .slot{grid-column:1;text-align:right}.row.r .slot{grid-column:3;text-align:left}
.node{position:relative;display:inline-grid;cursor:pointer;padding:4px 10px;border-radius:10px;border:0;background:none;text-align:inherit;max-width:100%}
.node:hover,.node.open{background:var(--fill)}
a.node{color:inherit;text-decoration:none}
.node.pn:hover{background:none}
.node .hring{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:47;stroke-dashoffset:47;transition:stroke-dashoffset .35s cubic-bezier(.2,.7,.2,1)}
.node:hover .hring,.node:focus-visible .hring{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.node .hring{transition:none}}
/* the dot sits on the title's first line, and the branch ends at the dot's centre: --tc is that centre, from the top of
   the row (the node's 4 px padding plus half a line of its title) */
:root{--tc:16.4px}
.node .t{display:flex;align-items:flex-start;gap:8px;font-weight:600;font-size:15.5px}
.dw{flex:none;display:flex;align-items:center;justify-content:center;height:1.6em}
.node .lb,.oi{min-width:0;overflow-wrap:anywhere}   /* a long file name or path breaks instead of running off a narrow screen */
.row.l .node .t{flex-direction:row-reverse}
.node .date{font-family:var(--mono);font-size:11px;color:var(--mut)}
.where .tag{white-space:nowrap;font-size:11px;font-weight:500;color:var(--bg);background:var(--ink);border-radius:5px;padding:0 5px;margin-left:6px}
.node .chev{color:var(--mut);font-weight:400;margin-left:6px}.node:hover .chev{color:var(--ink)}
.node.sup .t .lb{color:var(--mut);text-decoration:line-through}
.node.hl{outline:1.5px dashed var(--overturn)}
.ov{color:var(--overturn);font-size:13px;line-height:1.9}
.arm .scar{position:absolute;top:8px;width:11px;height:11px;border-radius:50%;border:2.4px solid var(--scar-m);background:var(--bg)}
.row.l .arm .scar{right:calc(50% + 9px)}.row.r .arm .scar{left:calc(50% + 9px)}
.scar.h,.ring.h{border-color:var(--scar-h)!important}.scar.d,.ring.d{border-color:var(--scar-d)!important}
.card{position:absolute;z-index:4;top:calc(100% + 6px);width:min(300px,80vw);background:var(--panel);border-radius:12px;padding:10px 13px;font-weight:400;font-size:13.5px;color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .15s;text-align:left;line-height:1.55}
.card.up{top:auto;bottom:calc(100% + 6px)}
.card em{font-style:normal;display:block;margin-top:5px;color:var(--mut);font-size:12.5px}
.row.l .card{right:0}.row.r .card{left:0}
.node:hover>.card,.node:focus-visible>.card{opacity:1}
.node.open>.card{display:none}
.more{display:none;margin-top:8px;gap:8px}
.card,.more{overflow-wrap:anywhere}   /* long file names and paths wrap instead of running off a narrow screen */
.oiex{display:none;margin-top:3px;font-size:12px}.oi.open .oiex{display:block}.oi.open>.card{display:none}
.slot.open .more{display:grid}
/* twigs, and a small "quote" mark after a sentence or twig a quote supports; the quote opens under it (as Notion's and Linear's
   citations show their source on request): the words were checked against the transcript when the ledger took them */
.twl{margin:0;padding-left:16px;display:grid;gap:2px;font-size:13px}.twl li::marker{color:var(--mut)}
.qm{all:unset;cursor:pointer;font-size:11px;color:var(--mut);border:1px solid var(--line2);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}.qm:hover,.qm.on{color:var(--ink);border-color:var(--mut)}
.qs{display:grid;gap:6px;margin:4px 0 2px}.qs[hidden]{display:none}.qh{font-size:11.5px;color:var(--mut)}
.qq{font-size:12.5px;color:var(--ink);background:var(--fill);border-radius:8px;padding:6px 9px;white-space:pre-wrap;overflow-wrap:anywhere}
.qq b{font-weight:600}.qq code{font-family:var(--mono);font-size:.92em;background:var(--line);border-radius:4px;padding:0 3px}
.more .ln{font-size:13.5px}
.more .ln em{font-style:normal;display:block;color:var(--mut);font-size:12.5px}
/* the story of a bumpy node: equal rows, one dashed segment from icon centre to icon centre */
.story{display:grid;gap:6px;text-align:left}
.story .dur{font-size:12.5px;color:var(--scar-m)}.story .dur.h{color:var(--scar-h)}.story .dur.d{color:var(--scar-d)}
.story .steps{display:grid;grid-auto-rows:1fr}
.story .st{position:relative;display:grid;grid-template-columns:16px 1fr;gap:0 10px;font-size:13px;min-height:44px}
.story .st:not(:last-child)::after{content:"";position:absolute;left:7px;top:9px;height:100%;border-left:2px dashed var(--scar-m)}
.story .ic{position:relative;z-index:1;height:18px;display:grid;place-items:center}
.story .ic>span{width:16px;height:16px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.story .ring{width:12px;height:12px;border-radius:50%;border:2.4px solid var(--scar-m)}
.story .dotg{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.story .dn{width:11px;height:11px;border-radius:50%;background:var(--done)}
.story .tx{padding:0 0 10px}.story .tx>i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mut);margin-right:8px}.story .tx b{font-weight:600;margin-right:6px}
.stag{font-size:11px;color:var(--ink);background:var(--fill);border-radius:5px;padding:0 5px;margin-right:6px}
.root{display:grid;justify-items:center;margin-top:20px;color:var(--mut);font-size:12px;font-family:var(--mono)}
.root path{stroke:var(--trunk)}
.rest{all:unset;cursor:pointer;font-size:12px;color:var(--mut);background:var(--bg);padding:0 8px;border-radius:6px;position:relative;z-index:1}.rest:hover,.rest:focus-visible{color:var(--ink)}
#ovl{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
#ovl path{fill:none;stroke:var(--overturn);stroke-width:2;stroke-dasharray:5 5}
/* the open-items drawer: one column, axis on the left */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);z-index:30;transform:translateX(100%);visibility:hidden;transition:transform .22s ease-out,visibility .22s;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;box-shadow:-10px 0 40px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer header{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 6px}
.drawer header b{font-size:16px}.drawer header small{font-family:var(--mono);color:var(--mut);font-size:11.5px;margin-left:8px}
.drawer header button{all:unset;cursor:pointer;color:var(--mut);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.drawer .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);padding:0 18px 8px}.drawer .lg span{display:inline-flex;gap:5px;align-items:center}
.drawer .scroll{overflow:auto;padding:4px 10px 40px;flex:1}
.ax{position:relative;display:grid;gap:7px;padding-left:34px}
.ax::before{content:"";position:absolute;left:14px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--trunk)}
.bk{position:relative;font-size:12px;color:var(--mut);margin:12px 0 2px}
.bk::before{content:"";position:absolute;left:-26px;top:9px;width:14px;height:2.5px;border-radius:2px;background:var(--mut)}
.bk.late{color:var(--late)}.bk.late::before{background:var(--late)}
.dv{font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.oi{position:relative;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;padding:2px 4px;border-radius:8px}
.oi:hover,.oi:has(.oit:focus-visible){background:var(--fill)}
.oit{all:unset;cursor:pointer;display:block;border-radius:4px}
.oi svg{margin-top:1px}.oi b{font-weight:500}
.oi .m{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mut)}.oi .m.late{color:var(--late)}
.oi .w{font-family:var(--f);color:var(--ink);background:var(--fill);border-radius:5px;padding:0 5px;font-size:11px}
.oi .card{top:calc(100% + 4px);left:0}
.oi:hover>.card,.oi:has(.oit:focus-visible)>.card{opacity:1}
.oi.hl{background:var(--fill);box-shadow:inset 0 0 0 1px var(--mut)}
/* while drawing: a pill as wide as its words, with a small tree that grows, rests and grows again, every part on one
   4.2 s cycle so each round starts from nothing. It stops once the run seems to have stopped and under reduced motion;
   a pause button shows on hover or keyboard focus (WCAG 2.2.2: motion that lasts over 5 s beside other content can be
   paused), and always where there is no hover */
.pending{position:relative;display:flex;align-items:center;gap:12px;width:fit-content;max-width:calc(100% - 32px);margin:0 auto 8px;padding:9px 18px 9px 14px;border-radius:999px;background:var(--panel);color:var(--ink);text-align:left;border:1px solid color-mix(in srgb,var(--done) 35%,transparent);box-shadow:0 0 22px -6px color-mix(in srgb,var(--done) 45%,transparent)}
.pending[hidden]{display:none}
.pending .hd{display:block;font-size:14px;font-weight:600}.pending .dt{display:block;font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.pending.late{border-color:var(--line2);box-shadow:none}
.gt{flex:none;width:30px;height:30px;overflow:visible}.gt path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-dasharray:1 2}
.gt circle{fill:var(--done);transform-box:fill-box;transform-origin:center}
.late .gt path{stroke:var(--mut)}.late .gt circle{fill:var(--mut)}
.grow .gt *{animation-duration:4.2s;animation-iteration-count:infinite;animation-timing-function:linear}
.grow .k0{animation-name:gt0}.grow .k1{animation-name:gt1}.grow .k2{animation-name:gt2}.grow .k3{animation-name:gt3}
.grow .f1{animation-name:gtp1}.grow .f2{animation-name:gtp2}.grow .f3{animation-name:gtp3}.grow .f4{animation-name:gtp4}
@keyframes gt0{0%{opacity:0;stroke-dashoffset:1}.1%{opacity:1;stroke-dashoffset:1}13%{stroke-dashoffset:0}88%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
@keyframes gt1{0%,10%{opacity:0;stroke-dashoffset:1}10.1%{opacity:1;stroke-dashoffset:1}21%{stroke-dashoffset:0}88%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
@keyframes gt2{0%,15%{opacity:0;stroke-dashoffset:1}15.1%{opacity:1;stroke-dashoffset:1}26%{stroke-dashoffset:0}88%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
@keyframes gt3{0%,20%{opacity:0;stroke-dashoffset:1}20.1%{opacity:1;stroke-dashoffset:1}30%{stroke-dashoffset:0}88%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
@keyframes gtp1{0%,24%{transform:scale(0)}29%{transform:scale(1.2)}32%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes gtp2{0%,28%{transform:scale(0)}33%{transform:scale(1.2)}36%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes gtp3{0%,32%{transform:scale(0)}37%{transform:scale(1.2)}40%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes gtp4{0%,36%{transform:scale(0)}41%{transform:scale(1.2)}44%,88%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.paused .gt *{animation-play-state:paused}
.pz{all:unset;cursor:pointer;margin-left:2px;padding:0 6px;border-radius:5px;color:var(--mut);font-size:11px;opacity:0;transition:opacity .15s}.pz:hover,.paused .pz{color:var(--ink)}.pz[hidden]{display:none}
.pending:hover .pz,.pz:focus-visible,.paused .pz{opacity:1}
@media (hover:none){.pz{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow .gt *{animation:none}}
footer{max-width:940px;margin:0 auto;padding:0 20px 30px;text-align:center;font-size:11.5px;color:var(--faint)}
@media (max-width:640px){:root{--tc:15.2px}.row{grid-template-columns:1fr 30px 1fr}.node .t{font-size:14px}
  .card,.card.up,.row.l .card,.row.r .card{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto;margin:0}}
</style></head>
<body>
<div class="bar">
  <button class="back" id="back" hidden></button>
  <div class="legend" id="legend"></div>
</div>
<div class="pending" id="pending" role="status" hidden></div>
<main id="web"></main>
<footer id="foot"></footer>

  tr.append(rows,rootEl(D.project.first_at?W.projStart(fdate(D.project.first_at)):''));m.append(tr);fixTrunk(tr)}
function fixTrunk(tr){requestAnimationFrame(()=>{const c=tr.querySelector('.crown'),t=tr.querySelector('.trunk');if(t)t.style.top=c?(c.offsetTop+c.offsetHeight)+'px':'0px'})}
/* the small tree in the line shown while a run draws: a trunk, three branches and four buds, spaced so that no two
   parts that are not joined touch */
function tree(){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 32 32');s.setAttribute('class','gt');s.setAttribute('aria-hidden','true');
  [['k0','M16 30V9.5'],['k1','M16 24C13 23 10.5 21 9 18'],['k2','M16 19.5C19 18.5 21.5 16.5 23 13.5'],['k3','M16 15.5C13.8 14.7 11.8 13.5 10.5 11.2']].forEach(([c,d])=>{
    const e=document.createElementNS(NS,'path');e.setAttribute('class',c);e.setAttribute('d',d);e.setAttribute('pathLength','1');s.append(e)});
  [['f1',9,18,2.1],['f2',23,13.5,2.1],['f3',10.5,11.2,1.9],['f4',16,7,2.3]].forEach(([c,x,y,r])=>{
    const e=document.createElementNS(NS,'circle');e.setAttribute('class',c);e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('r',r);s.append(e)});
  return s}
/* a session without a tree: its summary and two links that open Claude Code in a new terminal with the command typed in
   (claude-cli://, https://code.claude.com/docs/en/deep-links; nothing runs until Enter). A link can do nothing (Claude Code
   registers it on the first interactive prompt, and a setting turns it off), so a click also offers that command to copy. */
const shq=s=>/^[\w@%+=:,.\/-]+$/.test(s)?s:"'"+s.replace(/'/g,"'\\''")+"'";
const deep=q=>'claude-cli://open?cwd='+encodeURIComponent(D.project.path)+'&q='+encodeURIComponent(q);
/* copies the command; where the clipboard is not allowed, shows it beside the button, selected, and the button keeps focus */
function copyBtn(label,cmd){const b=$('button','cpy',label);b.title=cmd;
  b.onclick=e=>{e.stopPropagation();const show=()=>{let c=b.nextElementSibling;if(!c||c.tagName!=='CODE'){c=$('code',null,cmd);b.after(c)}
      const g=document.createRange();g.selectNodeContents(c);const w=getSelection();w.removeAllRanges();w.addRange(g);b.textContent=W.selected};
    try{navigator.clipboard.writeText(cmd).then(()=>{b.textContent=W.copied;setTimeout(()=>{b.textContent=label},1500)},show)}catch(x){show()}};return b}
function notYet(s){const box=$('div','xp'),sm=$('div','sum');
  if(s.summary){const a=$('span','ai',W.ai);a.title=W.aiTip;sm.append(a,s.summary)}else{sm.classList.add('none');sm.textContent=s.summarizing?W.genSum:W.noSummary}
  /* --no-open: the page is open already, so the run it starts updates it instead of asking for another tab */
  const draw='/treesight:treesight '+s.id.slice(0,8)+' --no-open',acts=$('div','acts');box.append(sm,acts);
  if(D.project.masked){acts.append(copyBtn(W.copyDraw,draw));return box}   /* a folder name that was masked cannot be opened */
  const after=$('div','after');after.setAttribute('role','status');   /* in the page from the start, so what it says is announced */
  [[W.draw,'act pri',draw,draw],[W.openS,'act','/resume '+s.id,'cd '+shq(D.project.path)+' && claude -r '+s.id]].forEach(([label,cls,q,cmd])=>{
    const a=$('a',cls,label);a.href=deep(q);a.addEventListener('click',e=>{e.stopPropagation();after.textContent='';after.append(W.noOpen,copyBtn(W.copyCmd,cmd))});acts.append(a)});
  acts.append(after);return box}
(function(){
  document.title='treesight · '+D.project.name;
  const back=document.getElementById('back');back.textContent=W.back;back.setAttribute('aria-label',W.backAria);
  document.getElementById('dtitle').textContent=W.open;document.getElementById('drawer').setAttribute('aria-label',W.open);
  const dc=document.getElementById('dclose');dc.textContent='×';dc.setAttribute('aria-label',W.close);
  document.getElementById('foot').textContent=W.foot(ymd(parse(D.asof)))+(D.hidden?' · '+W.hiddenN(D.hidden):'');
  if(D.pending){const p=document.getElementById('pending'),P=D.pending,m=Math.max(1,Math.ceil(Math.max(...P.map(x=>x.estimate_s||0))/60));
    /* a run 20 minutes past its estimate may have stopped; a new /treesight says "busy" only if it is still at work.
       The tree stops growing then too, so it never moves for a run that has stopped. */
    const late=()=>P.every(x=>Date.now()>parse(x.started_at||D.asof).getTime()+((x.estimate_s||0)+1200)*1000);
    const hd=$('span','hd'),dt=$('span','dt'),tx=$('span'),pz=$('button','pz','\u2016');tx.append(hd,dt);
    pz.setAttribute('aria-label',W.pause);pz.title=W.pause;pz.setAttribute('aria-pressed','false');
    pz.onclick=e=>{e.stopPropagation();p.classList.toggle('paused');pz.setAttribute('aria-pressed',String(p.classList.contains('paused')))};
    const show=()=>{const l=late(),h=l?W.pLateHead:W.pHead,d=l?W.pendingLate:P.length===1?W.pDetail(P[0].title,m):W.pDetailMany(P.map(x=>x.title),m);
      if(hd.textContent!==h)hd.textContent=h;if(dt.textContent!==d)dt.textContent=d;p.classList.toggle('grow',!l);p.classList.toggle('late',l);pz.hidden=l||RMQ};
    p.append(tree(),tx,pz);show();p.hidden=false;setInterval(show,30000)}
  /* the page keeps itself current: every build rewrites the stamp next to it (a one-line script in the same folder), and
     the page reloads when the stamp names a newer build. A run for another session, or a run that just ended, opens as a
     fresh page would; any other change keeps the view and where it was scrolled to. It also checks while hidden (the
     browser slows that down), so most reloads happen out of sight, and at once when shown again. */
  let kept=false;   /* reloaded in place after a correction: the tree is shown as it was, without growing again */
  if(D.live){const base=location.href.split(/[?#]/)[0],url=base.replace(/\.html$/,'')+'.stamp.js';let wait=0,fails=0,timer=0;
    /* kept across reloads of this tab: in sessionStorage, else in window.name */
    const keep=(k,v)=>{try{if(v===undefined)return JSON.parse(sessionStorage.getItem(k)||'null');sessionStorage.setItem(k,JSON.stringify(v));return v}
      catch(x){let o={};try{o=JSON.parse(window.name)||{}}catch(y){}if(v===undefined)return o[k]==null?null:o[k];o[k]=v;window.name=JSON.stringify(o);return v}};
    /* a loop guard: reloading for the same build three times without getting it means the stamp and the page disagree for
       good (a page that cannot be rewritten, say); then it gives up on that build, and a newer one is tried again.
       Reloads for builds that keep coming are not limited. */
    window.__treesight=st=>{if(!st)return;if(st.v===D.version){keep('treesight-wanted',null);return}
      const w=keep('treesight-wanted')||{},n=w.v===st.v?(w.n||0)+1:1;if(n>3)return;keep('treesight-wanted',{v:st.v,n});
      if(st.focus&&(st.focus!==D.focus||(D.pending&&!st.pending))){location.replace(base);return}
      /* anything else keeps the view: written into the address first, since without one the page would open on another session */
      const here=location.hash||(CUR?'#s='+CUR.id.slice(0,8):'#p');keep('treesight-scroll',[here,scrollY]);history.replaceState(null,'',base+here);location.reload()};
    const check=()=>{if(wait&&Date.now()-wait<10000)return;wait=Date.now();const sc=document.createElement('script');sc.src=url+'?t='+Date.now();
      sc.onload=sc.onerror=e=>{wait=0;sc.remove();fails=e.type==='error'?fails+1:0;if(fails===5){clearInterval(timer);timer=setInterval(check,30000)}};document.head.append(sc)};
    timer=setInterval(check,(D.pending?STAMP[0]:STAMP[1])*1000);
    const now=()=>{if(!document.hidden)check()};document.addEventListener('visibilitychange',now);document.addEventListener('resume',now);addEventListener('pageshow',now);
    const sv=keep('treesight-scroll');keep('treesight-scroll',null);if(sv&&sv[0]===location.hash){kept=true;requestAnimationFrame(()=>scrollTo(0,sv[1]))}}
  document.getElementById('dtoday').textContent=W.today(ymd(TODAY));
  dc.onclick=closeDrawer;
  document.getElementById('drawer').addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',closeDrawer);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
  back.onclick=()=>{if(fromP)history.back();else location.hash='p'};
  const route=()=>{const h=new URLSearchParams(location.hash.slice(1));showAll=!!h.get('all');CUR=null;
    const s=h.has('s')?byId8[h.get('s')]:HOME;
    if(h.has('p')||!s||!s.generated){fromP=false;projectView()}else sessionView(s);window.scrollTo(0,0);return h};
  window.addEventListener('hashchange',()=>{settle();route();run(600)});
  const h=route();
  if(h.has('t')){growing=grow(1000);const r=growing.rate||1;growing.forEach(a=>{a.pause();a.currentTime=+h.get('t')*r})}   /* stills for screenshots */
  else if(!kept){const first=store.get(SEEN)!==D.asof;store.set(SEEN,D.asof);whenSeen(()=>run(first?1000:600))}
  try{for(let i=localStorage.length;i--;){const k=localStorage.key(i);if(k&&k.startsWith('treesight-grown-'))localStorage.removeItem(k)}}catch(_){}   /* the old keys */
  if(h.get('drawer')){const r=document.querySelector('.todo');if(r)r.click()}
  if(h.get('expand')){const n=nodeEls[h.get('expand')];if(n)n.click()}
  if(h.get('poke')){document.querySelectorAll('.act').forEach(a=>{a.addEventListener('click',e=>e.preventDefault(),{once:true});a.click()});
    document.querySelectorAll('.qm,.oit,.cpy,.pz').forEach(x=>x.click())}   /* dev/check_page.py: each of these handlers runs once */
})();
