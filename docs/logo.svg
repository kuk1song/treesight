<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="72" height="72" role="img" aria-label="treesight logo: a small tree with two done dots and one open ring">
<style>
/* waits about 0.95 s (on GitHub the image can load before the page first paints; 0.8 s earlier when measured on 2026-10-20), grows in about 1.6 s, then the open
   ring pings twice; all motion ends by 4.6 s. The base styles are the finished tree, so a renderer that runs no
   animation, or a reader who asks for less motion, sees it whole */
.d{stroke-dasharray:1 2;animation:draw .45s cubic-bezier(.45,.05,.35,1) backwards}
.trunk{animation-delay:.95s}.left{animation-delay:1.35s}.right{animation-delay:1.6s}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .38s cubic-bezier(.34,1.56,.64,1) backwards}
.p1{animation-delay:1.75s}.p2{animation-delay:1.95s}.p3{animation-delay:2.15s}
.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping .9s cubic-bezier(.2,.7,.2,1) 2.8s 2}
@keyframes draw{0%{opacity:0;stroke-dashoffset:1}.1%{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ping{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){.d,.pop,.ping{animation:none}}
</style>
<rect x=".5" y=".5" width="39" height="39" rx="8.5" fill="#131417" stroke="#3D4048"/>
<g transform="translate(4.4 3.6) scale(.78)">
<path class="d trunk" pathLength="1" d="M20 37V16.5" stroke="#E9E8E3" stroke-width="4.5" stroke-linecap="round"/>
<path class="d left" pathLength="1" d="M20 29C14 29 10.5 26 8 21" fill="none" stroke="#E9E8E3" stroke-width="4" stroke-linecap="round"/>
<path class="d right" pathLength="1" d="M20 21C26 21 29.5 18 32 13" fill="none" stroke="#E9E8E3" stroke-width="4" stroke-linecap="round"/>
<circle class="pop p1" cx="8" cy="21" r="4.6" fill="#C8FF00"/>
<circle class="pop p2" cx="32" cy="13" r="4.6" fill="#C8FF00"/>
<circle class="ping" cx="20" cy="7.5" r="4.8" fill="none" stroke="#C8FF00" stroke-width="1.6"/>
<circle class="pop p3" cx="20" cy="7.5" r="4.8" fill="none" stroke="#C8FF00" stroke-width="3.2"/>
</g>
</svg>
