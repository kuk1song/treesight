<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="72" height="72" role="img" aria-label="treesight logo: a small tree growing, with two done dots and one open ring">
<style>
/* the tab icon of the page, growing once in about 1.6 s and then still; no motion for people who ask for less */
.d{stroke-dasharray:1 2;stroke-dashoffset:1;opacity:0;animation:draw .45s cubic-bezier(.45,.05,.35,1) forwards}
.trunk{animation-delay:.05s}.left{animation-delay:.45s}.right{animation-delay:.7s}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .38s cubic-bezier(.34,1.56,.64,1) forwards}
.p1{animation-delay:.85s}.p2{animation-delay:1.05s}.p3{animation-delay:1.25s}
@keyframes draw{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.d{animation:none;stroke-dashoffset:0;opacity:1}.pop{animation:none;transform:none}}
</style>
<rect x=".5" y=".5" width="39" height="39" rx="8.5" fill="#131417" stroke="#3D4048"/>
<g transform="translate(4.4 3.6) scale(.78)">
<path class="d trunk" pathLength="1" d="M20 37V16.5" stroke="#E9E8E3" stroke-width="4.5" stroke-linecap="round"/>
<path class="d left" pathLength="1" d="M20 29C14 29 10.5 26 8 21" fill="none" stroke="#E9E8E3" stroke-width="4" stroke-linecap="round"/>
<path class="d right" pathLength="1" d="M20 21C26 21 29.5 18 32 13" fill="none" stroke="#E9E8E3" stroke-width="4" stroke-linecap="round"/>
<circle class="pop p1" cx="8" cy="21" r="4.6" fill="#C8FF00"/>
<circle class="pop p2" cx="32" cy="13" r="4.6" fill="#C8FF00"/>
<circle class="pop p3" cx="20" cy="7.5" r="4.8" fill="none" stroke="#C8FF00" stroke-width="3.2"/>
</g>
</svg>
