name: Bug report
description: Something treesight did wrong, or a page that looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste text from your own sessions, file paths, emails, addresses or keys. Describe the session in general terms instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The command you ran (for example `/treesight:treesight release`) and what you did before it.
  - type: textarea
    id: report
    attributes:
      label: treesight's report or error
      description: The lines treesight printed in your conversation, with anything private removed.
      render: text
  - type: input
    id: version
    attributes:
      label: treesight version
      description: The version `claude plugin list` shows for treesight.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How treesight was installed
      options:
        - From the marketplace kuk1song/treesight (/plugin install)
        - From a local copy (claude --plugin-dir)
        - Other
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
