name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag, plugin.json and CHANGELOG.md agree
        run: python3 dev/check_release.py --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "treesight ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
