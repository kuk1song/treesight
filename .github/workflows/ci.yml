name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: system}   # the python3 that ships with macOS, what most users run
          - {os: macos-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: Use the system python3
        if: matrix.python == 'system'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec /usr/bin/python3 "$@"\n' > "$RUNNER_TEMP/bin/python"
          chmod +x "$RUNNER_TEMP/bin/python"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          /usr/bin/python3 --version
      - name: Cross-check the schema validator against jsonschema
        if: matrix.python == '3.13'
        run: python -m pip install jsonschema
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Sample page builds and has no unmasked address or email
        run: python dev/make_sample.py --out "$RUNNER_TEMP/demo.html"
      - name: Colour contrast
        run: python dev/palcheck.py
      - name: Both READMEs have the same number of sections
        run: test "$(grep -c '^## ' README.md)" = "$(grep -c '^## ' README.zh-CN.md)"
      - name: plugin.json's version has its CHANGELOG section
        run: python dev/check_release.py
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate the plugin and the marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
