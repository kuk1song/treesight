<style>
/* treesight page. Dark only for now. Every view grows from the bottom of what is visible when it appears
   (1 s the first time this data is seen, 0.6 s after; a click or key skips; nothing moves under reduced motion). */
/* colours: dev/palettes.json, scheme "default", dark; tests/test_page.py keeps the two in step */
:root{--bg:#0D0E11;--panel:#131417;--fill:#1D1E23;--line:#2B2C31;--line2:#33343A;--ink:#E9E8E3;--mut:#8F9095;--faint:#808186;
  --trunk:#3A3B41;--done:#C8FF00;--found:#FFD60A;--overturn:#9A9BA0;--waiting:#C8FF00;--hold:#6E6F74;--waiting-fill:none;--waiting-ring:#C8FF00;

  --f:-apple-system,"PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit}
:where(button,a,[tabindex]):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px}
.back{all:unset;cursor:pointer;position:fixed;left:0;top:96px;z-index:5;writing-mode:vertical-rl;letter-spacing:.3em;font-size:12.5px;color:var(--mut);background:var(--panel);border-radius:0 10px 10px 0;padding:14px 7px;transition:padding .15s ease-out,color .15s}
.back:hover,.back:focus-visible{color:var(--ink);padding-left:10px}.back[hidden]{display:none}
html:not([lang^="zh"]) .back{letter-spacing:.08em}
@media (max-width:1020px){.back{position:static;writing-mode:horizontal-tb;letter-spacing:0!important;border-radius:8px;padding:5px 11px;font-size:13.5px}.back:hover,.back:focus-visible{padding-left:11px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .scr{width:10px;height:10px;border-radius:50%;border:2.2px solid var(--scar-m);display:inline-block}
main{max-width:940px;margin:0 auto;padding:0 20px 60px}
.where{text-align:center;margin:6px 0 0;display:grid;justify-items:center;gap:4px}
.where b{font-size:15px;font-weight:600}.where small{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.where .since{font-family:var(--f);font-size:12px;color:var(--mut)}
svg.sh{flex:none;display:block;overflow:visible}
.tree{position:relative;padding:8px 0 30px}
.trunk{position:absolute;left:50%;top:150px;bottom:46px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--trunk)}
.crown{position:relative;display:grid;justify-items:center;align-content:start;padding:10px 0 14px;z-index:2}
.todo{all:unset;cursor:pointer;font-size:12.5px;color:var(--ink);background:var(--panel);padding:4px 12px;border-radius:999px;margin-top:6px;position:relative;z-index:1}
.todo:hover{background:var(--fill)}
.crown .cover,.crown .none{font-size:12px;color:var(--mut);background:var(--bg);padding:0 8px;margin-top:6px;position:relative;z-index:1}
.crown .none{font-size:12.5px}
.rows{position:relative;display:grid;gap:20px;margin-top:8px}
.row{display:grid;grid-template-columns:1fr 64px 1fr;align-items:start}
.arm{grid-column:2;height:26px;position:relative}
.arm svg{position:absolute;top:0;width:50%;height:26px}.arm path{stroke:var(--trunk)}
.row.l .arm svg{right:50%}.row.r .arm svg{left:50%}
.row .slot{grid-row:1;min-width:0}
.row.l .slot{grid-column:1;text-align:right}.row.r .slot{grid-column:3;text-align:left}
.node{position:relative;display:inline-grid;cursor:pointer;padding:4px 10px;border-radius:10px;border:0;background:none;text-align:inherit;max-width:100%}
.node:hover,.node.open{background:var(--fill)}
a.node{color:inherit;text-decoration:none}
.node.pn:hover{background:none}
.node .hring{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:47;stroke-dashoffset:47;transition:stroke-dashoffset .35s cubic-bezier(.2,.7,.2,1)}
.node:hover .hring,.node:focus-visible .hring{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.node .hring{transition:none}}
.node .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15.5px}
.row.l .node .t{flex-direction:row-reverse}
.node .date{font-family:var(--mono);font-size:11px;color:var(--mut)}
.where .tag{white-space:nowrap;font-size:11px;font-weight:500;color:var(--bg);background:var(--ink);border-radius:5px;padding:0 5px;margin-left:6px}
.node .chev{color:var(--mut);font-weight:400;margin-left:6px}.node:hover .chev{color:var(--ink)}
.node.sup .t .lb{color:var(--mut);text-decoration:line-through}
.node.hl{outline:1.5px dashed var(--overturn)}
.ov{color:var(--overturn);font-size:13px}
.arm .scar{position:absolute;top:8px;width:11px;height:11px;border-radius:50%;border:2.4px solid var(--scar-m);background:var(--bg)}
.row.l .arm .scar{right:calc(50% + 9px)}.row.r .arm .scar{left:calc(50% + 9px)}
.scar.h,.ring.h{border-color:var(--scar-h)!important}.scar.d,.ring.d{border-color:var(--scar-d)!important}

.card.up{top:auto;bottom:calc(100% + 6px)}
.card em{font-style:normal;display:block;margin-top:5px;color:var(--mut);font-size:12.5px}
.row.l .card{right:0}.row.r .card{left:0}
.node:hover>.card,.node:focus-visible>.card{opacity:1}
.node.open>.card{display:none}
.more{display:none;margin-top:8px;gap:8px}
.slot.open .more{display:grid}
.more .ln{font-size:13.5px;max-width:420px}.row.l .more .ln{margin-left:auto}
.more .ln em{font-style:normal;display:block;color:var(--mut);font-size:12.5px}
.twigs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut)}
.row.l .twigs{justify-content:flex-end}
.twigs span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:middle}
.acts{display:flex;gap:8px}.row.l .acts{justify-content:flex-end}
.acts button{all:unset;cursor:pointer;font-size:12.5px;color:var(--mut);background:var(--panel);border-radius:6px;padding:3px 9px}
.acts button:hover,.acts button:focus-visible{color:var(--ink)}
.src{display:none;font-size:12.5px;color:var(--mut);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;max-width:420px;white-space:pre-wrap}
.row.l .src{margin-left:auto}.slot.src-on .src{display:block}

.story{display:grid;gap:6px;max-width:420px;text-align:left}.row.l .story{margin-left:auto}
.story .dur{font-size:12.5px;color:var(--scar-m)}.story .dur.h{color:var(--scar-h)}.story .dur.d{color:var(--scar-d)}
.story .steps{display:grid;grid-auto-rows:1fr}
.story .st{position:relative;display:grid;grid-template-columns:16px 1fr;gap:0 10px;font-size:13px;min-height:44px}
.story .st:not(:last-child)::after{content:"";position:absolute;left:7px;top:9px;height:100%;border-left:2px dashed var(--scar-m)}
.story .ic{position:relative;z-index:1;height:18px;display:grid;place-items:center}
.story .ic>span{width:16px;height:16px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.story .ring{width:12px;height:12px;border-radius:50%;border:2.4px solid var(--scar-m)}
.story .dotg{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.story .dn{width:11px;height:11px;border-radius:50%;background:var(--done)}
.story .tx{padding:0 0 10px}.story .tx>i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mut);margin-right:8px}.story .tx b{font-weight:600;margin-right:6px}
.stag{font-size:11px;color:var(--ink);background:var(--fill);border-radius:5px;padding:0 5px;margin-right:6px}
.root{display:grid;justify-items:center;margin-top:20px;color:var(--mut);font-size:12px;font-family:var(--mono)}
.root path{stroke:var(--trunk)}
.rest{all:unset;cursor:pointer;font-size:12px;color:var(--mut);background:var(--bg);padding:0 8px;border-radius:6px;position:relative;z-index:1}.rest:hover,.rest:focus-visible{color:var(--ink)}
#ovl{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
#ovl path{fill:none;stroke:var(--overturn);stroke-width:2;stroke-dasharray:5 5}
/* the open-items drawer: one column, axis on the left */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);z-index:30;transform:translateX(100%);visibility:hidden;transition:transform .22s ease-out,visibility .22s;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;box-shadow:-10px 0 40px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer header{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 6px}
.drawer header b{font-size:16px}.drawer header small{font-family:var(--mono);color:var(--mut);font-size:11.5px;margin-left:8px}
.drawer header button{all:unset;cursor:pointer;color:var(--mut);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.drawer .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);padding:0 18px 8px}.drawer .lg span{display:inline-flex;gap:5px;align-items:center}
.drawer .scroll{overflow:auto;padding:4px 10px 40px;flex:1}
.ax{position:relative;display:grid;gap:7px;padding-left:34px}
.ax::before{content:"";position:absolute;left:14px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--trunk)}
.bk{position:relative;font-size:12px;color:var(--mut);margin:12px 0 2px}
.bk::before{content:"";position:absolute;left:-26px;top:9px;width:14px;height:2.5px;border-radius:2px;background:var(--mut)}
.bk.late{color:var(--late)}.bk.late::before{background:var(--late)}
.dv{font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.oi{position:relative;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;padding:2px 4px;border-radius:8px}
.oi:hover,.oi:focus-visible{background:var(--fill);outline:none}
.oi svg{margin-top:1px}.oi b{font-weight:500}
.oi .m{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mut)}.oi .m.late{color:var(--late)}
.oi .w{font-family:var(--f);color:var(--ink);background:var(--fill);border-radius:5px;padding:0 5px;font-size:11px}
.oi .card{top:calc(100% + 4px);left:0}
.oi:hover>.card,.oi:focus-visible>.card{opacity:1}
.oi.hl{background:var(--fill);box-shadow:inset 0 0 0 1px var(--mut)}
.pending{max-width:940px;margin:0 auto 6px;padding:8px 14px;border-radius:10px;background:var(--panel);color:var(--ink);font-size:13px;text-align:center}
.pending[hidden]{display:none}
footer{max-width:940px;margin:0 auto;padding:0 20px 30px;text-align:center;font-size:11.5px;color:var(--faint)}
@media (max-width:640px){.row{grid-template-columns:1fr 30px 1fr}.node .t{font-size:14px}
  .card,.card.up,.row.l .card,.row.r .card{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto;margin:0}}
</style></head>
